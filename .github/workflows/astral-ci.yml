name: Astral CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Optional Cargo package for a targeted nextest run, such as codex-core.
        required: false
        type: string
      test_filter:
        description: Optional nextest test filter for the targeted run.
        required: false
        type: string
      full:
        description: Run the full Linux nextest suite.
        required: false
        default: false
        type: boolean
      linux_artifacts:
        description: Build Linux amd64 and arm64 release artifacts.
        required: false
        default: false
        type: boolean
      test_threads:
        description: Nextest thread count for targeted/full runs.
        required: false
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: astral-ci-${{ github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  CARGO_HOME: /ci/cache/cargo
  RUSTUP_HOME: /ci/cache/rustup
  CARGO_TARGET_DIR: /ci/cache/target/astral-code
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  TMPDIR: /ci/tmp
  RUST_MIN_STACK: "8388608"

jobs:
  smoke:
    name: Smoke
    runs-on: [self-hosted, Linux, X64, astral-ci]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just

      - name: Prepare persistent cache directories
        run: mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR" "$TMPDIR"

      - name: Format check
        run: just fmt-check

      - name: Schema freshness check
        run: |
          just write-config-schema
          git diff --exit-code -- core/config.schema.json

      - name: Cleanup cheap build artifacts
        if: always()
        run: |
          find "$CARGO_TARGET_DIR" -type d -name incremental -prune -exec rm -rf {} + 2>/dev/null || true
          find "$TMPDIR" -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true

  targeted-test:
    name: Targeted Test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package != '' }}
    runs-on: [self-hosted, Linux, X64, astral-ci]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just,nextest

      - name: Prepare persistent cache directories
        run: mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR" "$TMPDIR"

      - name: Run targeted nextest
        shell: bash
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_THREADS: ${{ inputs.test_threads }}
        run: |
          set -euo pipefail
          args=(-p "$TARGET_PACKAGE" --test-threads "$TEST_THREADS")
          if [[ -n "$TEST_FILTER" ]]; then
            args+=("$TEST_FILTER")
          fi
          just test "${args[@]}"

      - name: Cleanup cheap build artifacts
        if: always()
        run: |
          find "$CARGO_TARGET_DIR" -type d -name incremental -prune -exec rm -rf {} + 2>/dev/null || true
          find "$TMPDIR" -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true

  full-linux:
    name: Full Linux Test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: [self-hosted, Linux, X64, astral-ci]
    timeout-minutes: 360
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just,nextest

      - name: Prepare persistent cache directories
        run: mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR" "$TMPDIR"

      - name: Enable Linux sandbox prerequisites
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run full Linux nextest
        env:
          TEST_THREADS: ${{ inputs.test_threads }}
        run: just test --test-threads "$TEST_THREADS"

      - name: Cleanup cheap build artifacts
        if: always()
        run: |
          find "$CARGO_TARGET_DIR" -type d -name incremental -prune -exec rm -rf {} + 2>/dev/null || true
          find "$TMPDIR" -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true

  linux-artifacts:
    name: Linux Artifact (${{ matrix.artifact_name }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_artifacts }}
    runs-on: [self-hosted, Linux, X64, astral-ci]
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: linux-amd64
            target: x86_64-unknown-linux-gnu
          - artifact_name: linux-arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Prepare persistent cache directories
        run: mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR" "$TMPDIR"

      - name: Install Linux arm64 cross linker
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail
          if ! command -v aarch64-linux-gnu-gcc >/dev/null || ! command -v aarch64-linux-gnu-g++ >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: cargo build -p codex-cli --bin astral --release --target "$TARGET"

      - name: Package artifact
        shell: bash
        env:
          ARTIFACT_NAME: astral-${{ matrix.artifact_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/$ARTIFACT_NAME"
          archive="$RUNNER_TEMP/$ARTIFACT_NAME.tar.gz"
          rm -rf "$staging" "$archive"
          mkdir -p "$staging"
          cp "$CARGO_TARGET_DIR/$TARGET/release/astral" "$staging/astral"
          chmod +x "$staging/astral"
          {
            echo "artifact=$ARTIFACT_NAME"
            echo "target=$TARGET"
            echo "commit=$GITHUB_SHA"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$staging/BUILD_INFO"
          (cd "$staging" && sha256sum astral BUILD_INFO > SHA256SUMS)
          tar -C "$staging" -czf "$archive" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astral-${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/astral-${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup cheap build artifacts
        if: always()
        run: |
          find "$CARGO_TARGET_DIR" -type d -name incremental -prune -exec rm -rf {} + 2>/dev/null || true
          find "$TMPDIR" -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true
